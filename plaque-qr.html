<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Plaque QR | Biloa House</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@500;600&display=swap">
<style>
body{margin:0;background:#F2ECDF}
a{color:#1E5B3E}
a:hover{color:#15432D}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;box-sizing:border-box;background:#F2ECDF;font-family:'Inter',sans-serif">
  <div data-screen-label="Plaque QR" style="width:400px;height:600px;flex:none;background:#FFFFFF;border-radius:18px;box-shadow:0 1px 0 #E4DCCB,0 24px 60px -20px rgba(27,58,42,.35);display:flex;flex-direction:column;align-items:center;padding:44px 36px 34px;box-sizing:border-box">
    <div style="width:118px;height:118px;border-radius:50%;border:3px solid #B8924F;background:#FBF8F0;display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box">
      <img src="assets/biloa-logo.jpg" alt="Biloa House" style="width:126px;height:126px;object-fit:cover;mix-blend-mode:multiply;display:block">
    </div>
    <div style="margin-top:20px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:40px;line-height:1;letter-spacing:.04em;color:#1E5B3E">BILOA HOUSE</div>
    <div style="margin-top:8px;font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:#1B3A2A">Jazz club · Restaurant · Café</div>
    <div style="margin-top:26px;width:196px;height:196px;border:1px solid #E4DCCB;border-radius:14px;padding:14px;box-sizing:border-box;background:#FFFFFF">
      <svg viewBox="{{ viewBox }}" width="100%" height="100%" shape-rendering="crispEdges" style="display:block">
        <path d="{{ qrPath }}" fill="#15432D"></path>
      </svg>
    </div>
    <div style="margin-top:22px;background:#15432D;color:#FFFFFF;border-radius:10px;padding:11px 20px;font-size:13.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase">Scannez pour voir le menu</div>
    <div style="margin-top:auto;display:flex;align-items:center;gap:10px;font-size:10.5px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:#B8924F">
      <span>Le son</span><span>·</span><span>Le goût</span><span>·</span><span>L'art</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;menuUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://thaddee12.github.io/menu-biloa-house/&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;QR code&quot;}}">
class Component extends DCLogic {
  state = { path: '', n: 29 };

  componentDidMount() { this.build(); }
  componentDidUpdate(prev) { if (prev.menuUrl !== this.props.menuUrl) this.build(); }

  build() {
    if (!window.qrcode) { this.t = setTimeout(() => this.build(), 100); return; }
    const qr = window.qrcode(0, 'M');
    qr.addData(this.props.menuUrl || 'https://thaddee12.github.io/menu-biloa-house/');
    qr.make();
    const n = qr.getModuleCount();
    let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += 'M' + c + ' ' + r + 'h1v1h-1z';
    this.setState({ path: d, n });
  }

  componentWillUnmount() { clearTimeout(this.t); }

  renderVals() {
    return { qrPath: this.state.path, viewBox: '0 0 ' + this.state.n + ' ' + this.state.n };
  }
}
</script>
</body>
</html>
